name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Sync Tokko Broker (si hay TOKKO_API_KEY, actualiza cache; si no, usa cache commiteado)
        env:
          TOKKO_API_KEY: ${{ secrets.TOKKO_API_KEY }}
          TOKKO_LANG: es_ar
        run: |
          if [ -n "$TOKKO_API_KEY" ]; then
            echo "→ TOKKO_API_KEY detectada, sincronizando..."
            node scripts/sync-tokko.mjs || echo "⚠ sync falló, se usará cache existente"
          else
            echo "ℹ TOKKO_API_KEY no configurada, usando src/data/tokko-*.json commiteado"
          fi

      - name: Build with Astro
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
